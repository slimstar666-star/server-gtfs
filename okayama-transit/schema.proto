// GTFS-Realtime Protocol Buffer Definitions
// Упрощенная версия для эмуляции данных Okayama

syntax = "proto2";

package transit_realtime;

message FeedMessage {
  required string header = 1;
  repeated FeedEntity entity = 2;
}

message FeedHeader {
  required string gtfs_realtime_version = 1;
  required uint64 timestamp = 2;
  enum Incrementality {
    FULL_DATASET = 0;
    DIFFERENTIAL = 1;
  }
  optional Incrementality incrementality = 3 [default = FULL_DATASET];
}

message FeedEntity {
  required string id = 1;
  optional VehiclePosition vehicle = 3;
}

message VehiclePosition {
  optional TripDescriptor trip = 1;
  optional VehicleDescriptor vehicle = 8;
  optional Position position = 6;
  optional uint32 current_stop_sequence = 7;
  optional string stop_id = 4;
  optional VehicleStopStatus current_status = 5 [default = IN_TRANSIT_TO];
  optional uint64 timestamp = 2;
  optional CongestionLevel congestion_level = 9;
  optional OccupancyStatus occupancy_status = 10;
}

message TripDescriptor {
  optional string trip_id = 1;
  optional string route_id = 2;
  optional string direction_id = 3;
  optional string start_time = 4;
  optional string start_date = 5;
}

message VehicleDescriptor {
  optional string id = 1;
  optional string label = 2;
  optional string license_plate = 3;
}

message Position {
  required float latitude = 1;
  required float longitude = 2;
  optional float bearing = 3;
  optional float odometer = 4;
  optional float speed = 5;
}

enum VehicleStopStatus {
  IN_TRANSIT_TO = 0;
  STOPPED_AT = 1;
  IN_TRANSIT_FROM = 2;
}

enum CongestionLevel {
  UNKNOWN_CONGESTION_LEVEL = 0;
  RUNNING_SMOOTHLY = 1;
  STOP_AND_GO = 2;
  CONGESTION = 3;
  SEVERE_CONGESTION = 4;
}

enum OccupancyStatus {
  EMPTY = 0;
  MANY_SEATS_AVAILABLE = 1;
  FEW_SEATS_AVAILABLE = 2;
  STANDING_ROOM_ONLY = 3;
  CRUSHED_STANDING_ROOM_ONLY = 4;
  FULL = 5;
  NOT_ACCEPTING_PASSENGERS = 6;
}
